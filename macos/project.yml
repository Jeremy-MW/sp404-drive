# Xcode project for the macOS app and its FSKit extension. Generate with `xcodegen`.
name: SP404Drive
options:
  bundleIdPrefix: com.polecatplugins
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: AB4959S2LR
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # The Rust core is built for arm64 only, for now (see build-rust.sh).
    ARCHS: arm64
targets:
  SP404Drive:
    type: application
    platform: macOS
    sources:
      - App
      # The GPL and the third-party notices travel with the app, in Contents/Resources.
      - path: ../LICENSE
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.txt
        buildPhase: resources
      # The licence texts of the crates compiled in, as Contents/Resources/licences.
      - path: ../licences
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SP-404 Drive
        NSHumanReadableCopyright: "Copyright © 2026 polecatplugins.com. GPL-3.0-only."
        # Keep in step with the version in Cargo.toml (sp404drive --version).
        CFBundleShortVersionString: "1.1.1"
        LSApplicationCategoryType: public.app-category.music
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
    # The sp404drive command goes in Contents/MacOS beside the app's own executable,
    # signed like it (hardened runtime; a timestamp when archiving). Xcode signs the app
    # after its build phases, so the app's signature covers it.
    postBuildScripts:
      - name: Add the sp404drive command
        script: |
          set -eu
          "$PROJECT_DIR/build-rust.sh" cli
          dst="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/sp404drive"
          ditto "$PROJECT_DIR/../target/aarch64-apple-darwin/$SP404_CARGO_PROFILE/sp404drive" "$dst"
          timestamp=--timestamp=none
          if [ "$ACTION" = install ]; then timestamp=--timestamp; fi
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime \
            "$timestamp" --identifier com.polecatplugins.sp404drive.cli "$dst"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/sp404drive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polecatplugins.sp404drive
        PRODUCT_NAME: SP-404 Drive
        # App/AppIcon.icon, an Icon Composer document (light, dark, clear and tinted).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The script runs cargo, which reads ~/.cargo and writes ../target.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SP404_CARGO_PROFILE: debug
        Release:
          SP404_CARGO_PROFILE: release
    dependencies:
      - target: SP404FS
        embed: true
        codeSign: true
  SP404FS:
    type: extensionkit-extension
    platform: macOS
    sources: [Extension]
    entitlements:
      path: Extension/SP404FS.entitlements
      properties:
        com.apple.developer.fskit.fsmodule: true
        com.apple.security.app-sandbox: true
        com.apple.security.device.serial: true
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: SP-404MKII
        CFBundleShortVersionString: "1.1.1"
        LSMinimumSystemVersion: "26.0"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSShortName: sp404
          FSPersonalities:
            SP404:
              FSName: SP-404MKII
          FSSupportedSchemes: [sp404]
          FSSupportsGenericURLResources: true
          FSSupportsBlockResources: false
          FSSupportsPathURLs: false
          FSRequiresSecurityScopedPathURLResources: false
          FSMediaTypes: {}
          FSActivateOptionSyntax:
            shortOptions: "o:"
    preBuildScripts:
      - name: Build the Rust core
        script: |
          "$PROJECT_DIR/build-rust.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SP404_RUST_LIB_DIR)/libsp404_ffi.a
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polecatplugins.sp404drive.fsmodule
        PRODUCT_NAME: SP404FS
        # The script runs cargo, which reads ~/.cargo and writes ../target.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SP404_RUST_LIB_DIR: $(PROJECT_DIR)/../target/aarch64-apple-darwin/$(SP404_CARGO_PROFILE)
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/../ffi/include
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../ffi/include
        LIBRARY_SEARCH_PATHS: $(SP404_RUST_LIB_DIR)
        OTHER_LDFLAGS: -lsp404_ffi -framework IOKit -framework CoreFoundation -liconv
      configs:
        Debug:
          SP404_CARGO_PROFILE: debug
        Release:
          SP404_CARGO_PROFILE: release
